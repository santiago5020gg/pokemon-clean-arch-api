spring:
  application:
    name: pokedex
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/pokedex}
    username: ${SPRING_DATASOURCE_USERNAME:pokedex}
    password: ${SPRING_DATASOURCE_PASSWORD:pokedex}
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only validates
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

# External PokeAPI (read-only, no key) — consumed by the out/pokeapi adapter
pokeapi:
  base-url: ${POKEAPI_BASE_URL:https://pokeapi.co/api/v2}

# Demo seed data (admin user + a few Pokemon) on an empty database
pokedex:
  seed:
    enabled: ${POKEDEX_SEED_ENABLED:true}

# JWT settings for the auth API
security:
  jwt:
    secret: ${SECURITY_JWT_SECRET:change-me-change-me-change-me-change-me-1234}
    expires-in-seconds: ${SECURITY_JWT_EXPIRES_IN:3600}

management:
  endpoints:
    web:
      exposure:
        include: health,info
