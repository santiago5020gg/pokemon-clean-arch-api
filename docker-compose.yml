services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pokedex
      POSTGRES_USER: pokedex
      POSTGRES_PASSWORD: pokedex
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pokedex"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/pokedex
      SPRING_DATASOURCE_USERNAME: pokedex
      SPRING_DATASOURCE_PASSWORD: pokedex
    ports:
      - "8080:8080"

volumes:
  pgdata:
